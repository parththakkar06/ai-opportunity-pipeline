name: Test and deploy to the Hugging Face Space

# On every push to main: run the tests, then publish the app to the private Space.
# One-time setup is in docs/DEPLOY.md. Needs a repository secret HF_TOKEN (a write token) and a
# repository variable HF_SPACE (for example "my-team/ai-opportunity-studio").

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-space
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend tests
        run: |
          pip install -r requirements.txt
          python -m pytest -q tests/
      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      HF_SPACE: ${{ vars.HF_SPACE }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the deploy settings exist
        run: |
          [ -n "$HF_SPACE" ] || { echo "Set the repository variable HF_SPACE (e.g. my-team/ai-opportunity-studio). See docs/DEPLOY.md."; exit 1; }
          [ -n "$HF_TOKEN" ] || { echo "Set the repository secret HF_TOKEN. See docs/DEPLOY.md."; exit 1; }
      - name: Assemble the Space repo (no binaries, no docs)
        run: |
          mkdir /tmp/space
          rsync -a ./ /tmp/space/ \
            --exclude .git --exclude .github --exclude docs --exclude tests --exclude design-system \
            --exclude outputs --exclude .cache --exclude frontend/node_modules --exclude frontend/dist --exclude frontend/public/data
          mkdir -p /tmp/space/outputs && touch /tmp/space/outputs/.gitkeep
          {
            printf -- '---\ntitle: AI Opportunity Studio\nsdk: docker\napp_port: 7860\npinned: false\n---\n\n'
            cat README.md
          } > /tmp/space/README.md
      - name: Push to the Space
        run: |
          cd /tmp/space
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from GitHub"
          git push -q --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
